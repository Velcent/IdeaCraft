      <symbol id="i-callout" viewBox="0 0 24 24"><path d="M4 4.5h16v12H10l-6 4z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><path d="M8 8.5h8M8 11.5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-divider" viewBox="0 0 24 24"><path d="M3 12h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

      <symbol id="i-page" viewBox="0 0 24 24"><path d="M5.5 3.5h8.7l4.3 4.3v12.7h-13z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.8V8h4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5.5H4.5V6H10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3 2.5 20.5h19Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1" fill="currentColor"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1" fill="currentColor"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16.5-.8 4.3 4.3-.8L19.8 7.7a2.4 2.4 0 0 0-3.4-3.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m14.5 5.5 3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v1.5H8L4 19h-.5Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><path d="M8 10.5h14l-3.5 9H4.5Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10a4.5 4.5 0 0 0 .9-8.9 6.5 6.5 0 0 0-12.4 1.2A3.9 3.9 0 0 0 7 18.5Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/></symbol>
      <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 9.5h1M9.5 9.5h1M13 9.5h1M16.5 9.5h1M6 12.7h1M9.5 12.7h1M13 12.7h1M16.5 12.7h1M8 15.5h8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m3.5 3.5 18 8.5-18 8.5 4-8.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7.5 12h14" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="i-wand" viewBox="0 0 24 24"><path d="m4 20 11-11M14 4l1 2.5L17.5 8 15 9l-1 2.5L13 9l-2.5-1L13 6.5ZM19.5 13l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 3.5 7 20.5M17 3.5l-2 17M4 8.5h16M3 15.5h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="10" r="1" fill="currentColor"/><circle cx="15.5" cy="10" r="1" fill="currentColor"/><path d="M8 14.5a5 5 0 0 0 8 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>

      <symbol id="i-download-cloud" viewBox="0 0 24 24"><path d="M7 17.5h10a4.5 4.5 0 0 0 .9-8.9 6.5 6.5 0 0 0-12.4 1.2A3.9 3.9 0 0 0 7 17.5ZM12 10v7M9.5 14.5 12 17l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  </svg>

  <div id="app" class="app" data-theme="light">
    <header id="titlebar" class="titlebar" data-tauri-drag-region>
      <div class="titlebar-left">
        <button class="tb-btn" id="sidebarToggle" title="Toggle sidebar  Ctrl + \" data-tip="Toggle sidebar" aria-label="Toggle sidebar"><svg class="ic"><use href="#i-sidebar"/></svg></button>
        <div class="nav-arrows">
          <button class="tb-btn" id="navBack" title="Back  Alt + ←" aria-label="Back"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
          <button class="tb-btn" id="navForward" title="Forward  Alt + →" aria-label="Forward"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
        </div>
        <div class="tabs" id="tabs" role="tablist"></div>
        <button class="tb-btn new-tab" id="newTab" title="New tab  Ctrl + T" aria-label="New tab"><svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <div class="titlebar-right">
        <button class="tb-btn window-btn" id="winMin" title="Minimize" aria-label="Minimize"><svg class="ic"><use href="#i-minimize"/></svg></button>
        <button class="tb-btn window-btn" id="winMax" title="Maximize" aria-label="Maximize"><svg class="ic"><use href="#i-maximize"/></svg></button>
        <button class="tb-btn window-btn close" id="winClose" title="Close" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <button class="workspace-switcher" id="workspaceBtn" title="Workspace">
            <span class="ws-avatar" id="wsAvatar">I</span>
            <span class="ws-name" id="wsName">IdeaCraft</span>
            <svg class="ic chev"><use href="#i-chevrons-updown"/></svg>
          </button>
          <div class="sidebar-head-actions">
            <button class="icon-btn" id="sideInbox" title="Inbox" aria-label="Inbox"><svg class="ic"><use href="#i-inbox"/></svg></button>
            <button class="icon-btn" id="sideNewPage" title="New page" aria-label="New page"><svg class="ic"><use href="#i-edit"/></svg></button>
          </div>
        </div>
        <div class="sidebar-scroll" id="sidebarScroll">
          <button class="search-btn" id="sideSearch">
            <svg class="ic"><use href="#i-search"/></svg>
            <span>Search or ask</span>
            <kbd>Ctrl K</kbd>
          </button>
          <nav class="side-nav">
            <button class="side-item" data-nav="home"><span class="side-item-icon"><svg class="ic"><use href="#i-home"/></svg></span><span>Home</span></button>
            <button class="side-item" data-nav="ai"><span class="side-item-icon"><svg class="ic"><use href="#i-sparkles"/></svg></span><span>IdeaCraft AI</span></button>
            <button class="side-item" data-nav="library"><span class="side-item-icon"><svg class="ic"><use href="#i-library"/></svg></span><span>Library</span></button>
          </nav>
          <div id="sidebarFavorites"></div>
          <div class="side-section" id="sidebarPrivate">
            <div class="side-section-head">
              <span>Private</span>
              <div class="side-section-actions">
                <button class="icon-btn tiny" id="newRootPage" title="New page" aria-label="New page"><svg class="ic"><use href="#i-plus"/></svg></button>
                <button class="icon-btn tiny" id="privateMore" title="More" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
              </div>
            </div>
            <div class="page-tree" id="pageTree"></div>
          </div>
          <div class="side-section" id="sidebarShared">
            <div class="side-section-head"><span>Workspace</span></div>
            <button class="side-item subtle" data-nav="templates"><span class="side-item-icon"><svg class="ic"><use href="#i-grid"/></svg></span><span>Templates</span></button>
            <button class="side-item subtle" data-nav="trash"><span class="side-item-icon"><svg class="ic"><use href="#i-trash"/></svg></span><span>Trash</span></button>
          </div>
        </div>
        <div class="sidebar-foot">
          <button class="side-item subtle" data-nav="settings"><span class="side-item-icon"><svg class="ic"><use href="#i-settings"/></svg></span><span>Settings</span></button>
          <div class="invite-card" id="inviteCard">
            <button class="invite-close" id="inviteClose" aria-label="Dismiss"><svg class="ic"><use href="#i-close"/></svg></button>
            <div class="invite-title"><svg class="ic"><use href="#i-user"/></svg> Invite members</div>
            <div class="invite-sub">Collaborate with your team.</div>
          </div>
          <div class="account-row" id="accountRow">
            <span class="account-avatar" id="accountAvatar">A</span>
            <span class="account-name" id="accountName">You</span>
            <svg class="ic chev" style="width:12px;height:12px"><use href="#i-chevrons-updown"/></svg>
          </div>
        </div>
        <div class="sidebar-resizer" id="sidebarResizer"></div>
      </aside>

      <main id="main" class="main">
        <div id="view" class="view"></div>
      </main>
    </div>
  </div>

  <div id="overlays" class="overlays"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
