[package]
name = "ideacraft"
version = "1.0.0"
description = "IdeaCraft - a workspace for your ideas"
authors = ["IdeaCraft"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "ideacraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
base64 = "0.22"
rfd = "0.15"
open = "5"
regex = "1"
ureq = { version = "2.10", features = ["json"] }
arboard = "3.4"
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }

[features]
# Enable for production builds so the frontend is embedded instead of loaded from devUrl.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
